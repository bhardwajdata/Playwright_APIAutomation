name: API Automation Workflow

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:     
          node-version: lts/*
          cache: npm
          cache-dependency-path: Api_PWAutomation/package-lock.json

      - name: List contents of working directory
        run: ls -R

      - name: Install dependencies
        run: npm ci
        working-directory: Api_PWAutomation

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: Api_PWAutomation 

      - name: Run Playwright API tests
        run: npx playwright test --grep '@api' --reporter=list,playwright-smart-reporter --output=test-results/
        working-directory: Api_PWAutomation

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Api_PWAutomation/tests/smart-report.html

