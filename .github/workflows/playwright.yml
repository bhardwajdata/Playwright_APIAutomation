name: API Automation Workflow

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:     
          node-version: lts/*
          cache: npm
          cache-dependency-path: Api_PWAutomation/package-lock.json

      - name: List contents of working directory
        run: ls -R

      - name: Install dependencies
        run: npm ci
        working-directory: Api_PWAutomation

      - name: Run Playwright API tests
        run: npx playwright test --grep '@api' --reporter=list,playwright-smart-reporter --output=test-results/
        working-directory: Api_PWAutomation

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Api_PWAutomation/tests/smart-report.html

  cleanup-old-workflow-runs:
    needs: api-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 2

